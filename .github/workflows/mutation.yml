name: Mutation Testing

on:
  pull_request:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-testing-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'full' }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm test:mutation
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutation-reports
          path: |
            apps/*/reports/mutation/mutation.html
            apps/*/reports/mutation/mutation.json
            packages/*/reports/mutation/mutation.html
            packages/*/reports/mutation/mutation.json
          retention-days: 7
