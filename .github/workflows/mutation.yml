name: Mutation Testing

on:
  pull_request:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'full' }}
  cancel-in-progress: true

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: crawler
            path: apps/crawler
          - workspace: web
            path: apps/web
          - workspace: analytics
            path: packages/analytics
          - workspace: date-utils
            path: packages/date-utils
          - workspace: db
            path: packages/db
          - workspace: meta
            path: packages/meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Restore incremental mutation report
        uses: actions/cache@v5
        with:
          path: ${{ matrix.path }}/reports/stryker-incremental.json
          key: mutation-incremental-v1-${{ runner.os }}-${{ matrix.workspace }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', format('{0}/package.json', matrix.path), format('{0}/stryker.config.json', matrix.path), format('{0}/tsconfig*.json', matrix.path), format('{0}/vitest*.config.ts', matrix.path)) }}-${{ github.sha }}
          restore-keys: |
            mutation-incremental-v1-${{ runner.os }}-${{ matrix.workspace }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', format('{0}/package.json', matrix.path), format('{0}/stryker.config.json', matrix.path), format('{0}/tsconfig*.json', matrix.path), format('{0}/vitest*.config.ts', matrix.path)) }}-
      - name: Validate incremental mutation report
        env:
          INCREMENTAL_REPORT_PATH: ${{ matrix.path }}/reports/stryker-incremental.json
        run: |
          if test -f "$INCREMENTAL_REPORT_PATH" && ! node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$INCREMENTAL_REPORT_PATH"; then
            echo "Ignoring an invalid incremental mutation report"
            rm -f "$INCREMENTAL_REPORT_PATH"
          fi
      - run: pnpm --filter @mf-dashboard/${{ matrix.workspace }} test:mutation
      - name: Verify mutation reports
        run: |
          test -s "${{ matrix.path }}/reports/mutation/mutation.html"
          test -s "${{ matrix.path }}/reports/mutation/mutation.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutation-report-${{ matrix.workspace }}
          path: |
            ${{ matrix.path }}/reports/mutation/mutation.html
            ${{ matrix.path }}/reports/mutation/mutation.json
          if-no-files-found: error
          retention-days: 7
