name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, new-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ./.github/actions/setup-node
      - run: pnpm lint --format=github
      - run: pnpm format --check
      - run: pnpm knip
      - run: pnpm typecheck --affected
      - run: pnpm test --affected
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ./.github/actions/setup-node
      - run: pnpm build:demo --affected
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCESS_AUD: ci-access-audience
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ci.cloudflareaccess.com
      DASHBOARD_URL: https://dashboard.example.com
      REFRESH_TOKEN: ci-refresh-token
    strategy:
      fail-fast: false
      matrix:
        app: [crawler, web]
    steps:
      - uses: actions/checkout@v6.1.0
      - run: cp .env.example .env
      - run: docker compose build ${{ matrix.app }}
  e2e-web:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-node
      - run: pnpm test:e2e:web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
