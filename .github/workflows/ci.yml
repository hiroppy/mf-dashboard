name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, new-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup-node
      - run: pnpm lint --format=github
      - run: pnpm format --check
      - run: pnpm knip
      - run: pnpm typecheck --affected
      - run: pnpm test --affected
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup-node
      - run: pnpm build:demo --affected
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [crawler, web]
    steps:
      - uses: actions/checkout@v6.0.3
      - run: cp .env.example .env
      - run: docker compose build ${{ matrix.app }}
  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup-node
      - run: pnpm test:e2e:web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
