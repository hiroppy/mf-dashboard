name: Setup Node
description: Setup pnpm and Node.js with dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v6.4.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
