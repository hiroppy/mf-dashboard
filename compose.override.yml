# フォーク固有の上書き。上流の compose.yml は編集しない。
#
# - web は LAN からも直接届くよう publish する。ページ側に認証チェックが無いので、
#   宅内のどの端末からも無認証で閲覧できる。これは意図した設計 (SELFHOST.md 参照)
# - 外出先からは Tailscale 経由で同じ web へ届く
# - cloudflared は起動しない (docker compose up -d migrate web crawler)
#
# publish 先は .env の WEB_PUBLISH で変えられる (既定は LAN へ公開)。ここを直値で
# 書くと到達範囲を変えるたびにコミットが要るため、値は .env 側へ出してある。
#   WEB_PUBLISH=127.0.0.1:8765:8765   ホスト内だけ
#   WEB_PUBLISH=8765:8765             LAN へ公開 (既定)
services:
  web:
    environment:
      AUTH_MODE: ${AUTH_MODE:-}
    ports:
      - "${WEB_PUBLISH:-8765:8765}"

  crawler:
    environment:
      CREDENTIALS_SOURCE: ${CREDENTIALS_SOURCE:-}
      MF_USERNAME: ${MF_USERNAME:-}
      MF_PASSWORD: ${MF_PASSWORD:-}
      # MF が新しい端末へメールで送るワンタイムコードを、走行中に外から手渡す口。
      # data/ はホストへ bind mount 済みなので、ホスト側から書けば crawler が読む
      OTP_CODE_FILE: /app/data/otp-code.txt
      OTP_WAIT_TIMEOUT_SECONDS: ${OTP_WAIT_TIMEOUT_SECONDS:-}
      OTP_EVENT_LOG: ${OTP_EVENT_LOG:-}
