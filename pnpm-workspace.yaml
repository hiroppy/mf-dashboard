packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

patchedDependencies:
  "@stryker-mutator/core@9.6.1": patches/@stryker-mutator__core@9.6.1.patch
  "@stryker-mutator/typescript-checker@9.6.1": patches/@stryker-mutator__typescript-checker@9.6.1.patch

packageExtensions:
  "@stryker-mutator/core@9.6.1":
    dependencies:
      typescript-stryker: npm:typescript@6.0.3
  "@stryker-mutator/typescript-checker@9.6.1":
    dependencies:
      typescript-stryker: npm:typescript@6.0.3

minimumReleaseAgeExclude:
  - "@storybook/addon-a11y@10.5.5"
  - "@storybook/addon-vitest@10.5.5"
  - "@storybook/builder-vite@10.5.5"
  - "@storybook/csf-plugin@10.5.5"
  - "@storybook/nextjs-vite@10.5.5"
  - "@storybook/react@10.5.5"
  - "@storybook/react-dom-shim@10.5.5"
  - "@storybook/react-vite@10.5.5"
  - storybook@10.5.5

catalog:
  "@stryker-mutator/core": 9.6.1
  "@stryker-mutator/typescript-checker": 9.6.1
  "@stryker-mutator/vitest-runner": 9.6.1
  "@libsql/client": 0.17.4
  "@types/node": 25.9.5
  "@vitest/browser-playwright": 4.1.10
  drizzle-orm: 0.45.2
  playwright: 1.62.1
  playwright-core: 1.62.1
  typescript: 7.0.2
  vitest: 4.1.10
