- description: 月次状況が収入・支出・収支と詳細導線を返す
  vars:
    question: 今月どう？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        allowedVisibleAmounts: [313235, 219894, 93341]
        allowedVisibleDates: ["2026-07-01", "2026-07-31"]
        allowedVisibleMonths: ["2026-07"]
        allowedVisiblePercentages: [29.8, 30]
        visibleAmountClaims:
          - { label: 収入, amount: 313235 }
          - { label: 支出, amount: 219894 }
          - { label: 収支, amount: 93341 }
          - { label: 黒字, amount: 93341 }
          - { label: プラス, amount: 93341 }
          - { label: 余剰, amount: 93341 }
          - { label: 手残り, amount: 93341 }
          - { label: 純収入, amount: 93341 }
        visiblePercentageClaims:
          - { label: 貯蓄率, amount: 29.8 }
          - { label: 貯蓄率, amount: 30 }
        allowedInsightMetrics:
          - { amount: 93341, amountType: balance, labelPattern: (黒字|収支|余剰|手残り) }
        expectedCardTextFacts:
          - { cardType: summary, pattern: "(2026[-/]07|2026年7月|7月)" }
        expectedCardTitleFacts:
          - { cardType: summary, pattern: "(家計|収支|月次|キャッシュフロー)" }
        forbiddenVisiblePatterns:
          - (赤字(?!\s*(では|じゃ)(なく|ない|ありません))|収支.{0,10}(マイナス|負)|マイナス.{0,10}収支)
          - (黒字|プラス|余剰|手残り)(とは言えません|とは限りません|ではない|ではなく|でない|ではありません)
          - (貯蓄|積立|予算|見直し).{0,12}(不要(?!\s*(?:では|じゃ)(?:ありません|ない|なく))|必要ありません|必要ない|しなくてよい|しなくてもよい)
          - ((支出|出費).{0,12}(収入|所得).{0,12}(上回(?!っていません|っていない|らない)|超え(?!ていません|ていない|ない)|多い(?!わけではありません|わけではない|とは限りません|とは限らない))|(収入|所得).{0,12}(支出|出費).{0,12}(下回(?!っていません|っていない|らない)|少ない(?!わけではありません|わけではない|とは限りません|とは限らない)))
          - ((収入|所得).{0,12}(支出|出費)|(支出|出費).{0,12}(収入|所得)).{0,12}(同額(?!\s*(?:では|じゃ)(?:ありません|ない|なく))|同じ(?!(?:くらい|程度)?\s*(?:では|じゃ)(?:ありません|ない|なく))(?:くらい|程度)?|等しい(?!\s*(?:とは|わけでは)?(?:ありません|ない))|ほぼ同額(?!\s*(?:では|じゃ)(?:ありません|ない))|ほぼ同じ(?!\s*(?:では|じゃ)(?:ありません|ない))|大差(?:が)?ない|差(?:が)?ない)
          - (収入|所得)(は|が)?(ありません|ございません|ない|発生していません)
          - (支出|出費)(は|が)?(ありません|ございません|ない|発生していません)
          - (貯蓄|積立).{0,12}(できていません|できていない|できません|できない|していません|していない|ありません|ない|なし|ゼロ)
          - ((支出|出費).{0,12}予算.{0,8}(内|範囲内|以下|超過|オーバー|上回|下回)(?![^。！？\n]{0,16}(判断でき|わかり|分かり|不明|とは限|とは言え))|予算.{0,12}(内|範囲内|以下|超過|オーバー|上回|下回)(?![^。！？\n]{0,16}(判断でき|わかり|分かり|不明|とは限|とは言え)).{0,8}(支出|出費))
          - ((収入|所得).{0,20}(すべて|全て|全部|全額|のみ|だけ).{0,8}(給与|給料|賞与|ボーナス|事業収入|副業|利息|ポイント)(?![^。！？\n]{0,16}(とは限|とは言え|断定でき|判断でき|不明))|(給与|給料|賞与|ボーナス|事業収入|副業|利息|ポイント).{0,12}(が|で)(収入|所得).{0,8}(すべて|全て|全部|全額|を構成|を占め))
          - ((支出|出費).{0,20}(すべて|全て|全部|全額|のみ|だけ).{0,8}(住宅費|食費|日用品|水道・光熱費|交通費|通信費|医療費|教育費|娯楽費)(?![^。！？\n]{0,16}(とは限|とは言え|断定でき|判断でき|不明))|(住宅費|食費|日用品|水道・光熱費|交通費|通信費|医療費|教育費|娯楽費).{0,12}(が|で)(支出|出費).{0,8}(すべて|全て|全部|全額|を構成|を占め))
        expectedMetrics:
          - { label: 収入, amount: 313235, amountType: income }
          - { label: 支出, amount: 219894, amountType: expense }
          - { label: 収支, amount: 93341, amountType: balance }
        expectedDataToolFacts:
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.totalIncome,
              value: 313235,
            }
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.totalExpense,
              value: 219894,
            }
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.netIncome,
              value: 93341,
            }
        derivedVisibleClaims:
          - { amount: 29.8, sourceValues: [93341, 313235] }
          - { amount: 30, sourceValues: [93341, 313235] }
        requiredInsightPatterns:
          - (黒字|プラス|余剰|手残り)
          - (貯蓄|積立|予算|見直し|確保)
        expectedInsightActionPattern: (家計|収支|月次|予算|支出|内訳|詳細)
        expectedCardTypes: [summary, insight]
        expectedRoute: /0/cf/2026-07

- description: 食費がカテゴリ合計・内訳・詳細導線を返す
  vars:
    question: 今月の食費は？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        allowedVisibleAmounts: [41837, 219894]
        allowedVisibleMonths: ["2026-07"]
        allowedCardHeadingDates: ["2026-07-01", "2026-07-31"]
        allowedFallbackTextDates: ["2026-07-01", "2026-07-31"]
        allowedVisiblePercentages: [19, 19.03]
        visibleAmountClaims:
          - { label: 食費, amount: 41837 }
          - { label: 支出, amount: 219894 }
        visiblePercentageClaims:
          - { label: 食費, amount: 19, basisPattern: (支出|出費|総支出) }
          - { label: 食費, amount: 19.03, basisPattern: (支出|出費|総支出) }
        expectedCardFacts: [食費]
        expectedCardTitleFacts:
          - { cardType: summary, pattern: 食費 }
          - { cardType: categoryBreakdown, pattern: 食費 }
        expectedMetrics:
          - { label: 食費, amount: 41837, amountType: expense }
        expectedDataToolFacts:
          - {
              toolName: getMonthlyCategoryTotals,
              input: { month: "2026-07" },
              path: $.*,
              value: { category: 食費, type: expense, totalAmount: 41837 },
            }
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.totalExpense,
              value: 219894,
            }
        derivedVisibleClaims:
          - { amount: 19, sourceValues: [41837, 219894] }
          - { amount: 19.03, sourceValues: [41837, 219894] }
        expectedCategories:
          - { label: 食費, amount: 41837, amountType: expense, percentage: 19.03 }
        expectedCardTextFacts:
          - { cardType: summary, pattern: "(2026[-/]07|2026年7月|7月)" }
          - { cardType: categoryBreakdown, pattern: "(2026[-/]07|2026年7月|7月)" }

        forbiddenVisiblePatterns:
          - 食費.{0,16}(ありません|ない|なし|見つかりません|ゼロ)
        expectedCardTypes: [summary, categoryBreakdown]
        expectedRoute: /0/cf/2026-07

- description: 日付別支出が対象日・合計・明細を返す
  vars:
    question: 今月10日の支出を見たい
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        allowedVisibleAmounts: [6587, 3435, 3152]
        allowedVisibleDates: ["2026-07-10"]
        allowedVisibleMonths: ["2026-07"]
        allowedVisiblePercentages: []
        visibleAmountClaims:
          - { label: 支出, amount: 6587 }
        expectedMetrics:
          - { label: 支出, amount: 6587, amountType: expense }
        expectedCardTextFacts:
          - { cardType: summary, pattern: "(2026[-/]07[-/]10|7月10日|7/10)" }
          - { cardType: transactionList, pattern: "(2026[-/]07[-/]10|7月10日|7/10)" }
        expectedCardActionFacts:
          - {
              cardType: action,
              pattern: "(?=.*(2026[-/]07[-/]10|7月10日|7/10))(?=.*(支出|明細|内訳))",
            }
        expectedCardTitleFacts:
          - { cardType: summary, pattern: "(支出|出金|支払い)" }
          - { cardType: transactionList, pattern: "(支出|出金|支払い)" }
        expectedTransactions:
          - {
              ids: ["1229", demo_001260],
              date: "2026-07-10",
              description: 東京ガス ガス代,
              amount: 3435,
              amountType: expense,
              category: 水道・光熱費,
            }
          - {
              ids: ["1234", demo_001265],
              date: "2026-07-10",
              description: 成城石井,
              amount: 3152,
              amountType: expense,
              category: 食費,
            }
        requireTransactionToolGrounding: true
        expectedDataToolFacts:
          - {
              toolName: searchTransactions,
              input: { date: "2026-07-10", type: expense },
              path: $.transactions.*,
              value:
                {
                  date: "2026-07-10",
                  description: 東京ガス ガス代,
                  category: 水道・光熱費,
                  type: expense,
                  amount: 3435,
                },
            }
          - {
              toolName: searchTransactions,
              input: { date: "2026-07-10", type: expense },
              path: $.transactions.*,
              value:
                {
                  date: "2026-07-10",
                  description: 成城石井,
                  category: 食費,
                  type: expense,
                  amount: 3152,
                },
            }
        derivedVisibleClaims:
          - { amount: 6587, sourceValues: [3435, 3152] }
        forbiddenVisiblePatterns:
          - (7月10日|2026[-/]07[-/]10|支出|明細|取引).{0,16}(ありません|ない|なし|見つかりません|ゼロ)
        expectedCardTypes: [summary, transactionList, action]
        expectedRoute: /0/cf/2026-07

