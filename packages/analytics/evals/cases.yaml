- description: 月次収支が収入・支出・収支の正しい値を返す
  vars:
    question: 2026年7月の収入・支出・収支を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
    verificationSql: >-
      SELECT
        SUM(CASE WHEN type = 'income' THEN amount ELSE 0 END) AS income,
        SUM(CASE WHEN type = 'expense' THEN amount ELSE 0 END) AS expense
      FROM transactions
      WHERE substr(date, 1, 7) = '2026-07'
        AND is_transfer = 0
        AND is_excluded_from_calculation = 0
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["2026年7月"]
        expectedTextPairFacts: ["2026年7月"]
        expectedTextPairs:
          - [収入, "313235"]
          - [支出, "219894"]
          - [収支, "93341"]
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          expectedRows:
            - ["313235", "219894"]
          expectedRowAssociations:
            - [income, "313235"]
            - [expense, "219894"]
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "2026-07",
              "\\bselect\\b(?:(?!\\bfrom\\b)[\\s\\S])*?(?<!\\bas\\s)\\bamount\\b(?:(?!\\bfrom\\b)[\\s\\S])*?\\bfrom\\b",
              "\\btype\\b",
              "\\b(?:sum|total)\\s*\\(",
              "\\bis_transfer\\b\\s*=\\s*(?:0|false)",
              "\\bis_excluded_from_calculation\\b\\s*=\\s*(?:0|false)",
            ]
        forbiddenTextTerms:
          [
            transactions,
            is_transfer,
            is_internal_transfer,
            is_excluded_from_calculation,
            ":groupId",
          ]

- description: 食費の内訳を正しい円グラフで返す
  vars:
    question: 2026年7月の食費合計と内訳を円グラフで見せて
    evaluationDate: "2026-07-31T03:00:00.000Z"
    verificationSql: >-
      SELECT sub_category AS label, SUM(amount) AS total
      FROM transactions
      WHERE substr(date, 1, 7) = '2026-07'
        AND type = 'expense'
        AND category = '食費'
        AND is_transfer = 0
        AND is_excluded_from_calculation = 0
      GROUP BY sub_category
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPairs:
          - [食費, "41837"]
        expectedCharts:
          - chartType: pie
            titlePatterns: ["2026年7月", 食費]
            unit: currency
            series:
              - { name: 支出, amountType: expense }
            data:
              - { label: 食料品, values: [24833] }
              - { label: 外食, values: [12214] }
              - { label: カフェ, values: [4790] }
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          expectedRows:
            - [食料品, "24833"]
            - [外食, "12214"]
            - [カフェ, "4790"]
          expectedRowAssociations:
            - [食料品, "24833"]
            - [外食, "12214"]
            - [カフェ, "4790"]
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "2026-07",
              "\\bselect\\b(?:(?!\\bfrom\\b)[\\s\\S])*?(?<!\\bas\\s)\\bamount\\b(?:(?!\\bfrom\\b)[\\s\\S])*?\\bfrom\\b",
              "\\b(?:category|sub_category)\\b",
              "食費",
              "\\btype\\b\\s*=\\s*['\"]expense['\"]",
              "\\bis_transfer\\b\\s*=\\s*(?:0|false)",
              "\\bis_excluded_from_calculation\\b\\s*=\\s*(?:0|false)",
            ]
        forbiddenTextTerms:
          [
            transactions,
            is_transfer,
            is_internal_transfer,
            is_excluded_from_calculation,
            ":groupId",
          ]

