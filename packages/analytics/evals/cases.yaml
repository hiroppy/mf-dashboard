- description: 月次収支が収入・支出・収支の正しい値を返す
  vars:
    question: 2026年7月の収入・支出・収支を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
    verificationSql: >-
      SELECT
        SUM(CASE
          WHEN type = 'income' THEN amount
          WHEN type = 'transfer' AND is_internal_transfer = 0
            AND account_id IS NOT NULL AND transfer_target_account_id IS NULL THEN amount
          ELSE 0
        END) AS income,
        SUM(CASE
          WHEN type = 'expense' THEN amount
          WHEN type = 'transfer' AND is_internal_transfer = 0
            AND account_id IS NULL AND transfer_target_account_id IS NOT NULL THEN amount
          ELSE 0
        END) AS expense
      FROM transactions
      WHERE substr(date, 1, 7) = '2026-07'
        AND (type = 'transfer' OR is_excluded_from_calculation = 0)
        AND (
          account_id IN (SELECT account_id FROM group_accounts WHERE group_id = :groupId)
          OR transfer_target_account_id IN (
            SELECT account_id FROM group_accounts WHERE group_id = :groupId
          )
        )
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["2026年7月"]
        expectedTextPairFacts: ["2026年7月"]
        expectedTextPairs:
          - [収入, "313235"]
          - [支出, "219894"]
          - [収支, "93341"]
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          requiredSqlLiteralBindingGroups:
            - - [
                  "2026-07",
                  "(?:substr\\s*\\(\\s*date\\s*,\\s*1\\s*,\\s*7\\s*\\)|\\bdate\\b)\\s*(?:=|like)\\s*__required_literal__",
                ]
            - - ["2026-07-01", "\\bdate\\b\\s*>=\\s*__required_literal__"]
              - ["2026-08-01", "\\bdate\\b\\s*<\\s*__required_literal__"]
            - - ["2026-07-01", "\\bdate\\b\\s+between\\s+__required_literal__\\s+and\\s+\\?"]
              - ["2026-07-31", "\\bdate\\b\\s+between\\s+\\?\\s+and\\s+__required_literal__"]
          expectedRows:
            - ["313235", "219894"]
          expectedRowAssociations:
            - [income, "313235"]
            - [expense, "219894"]
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "(?:\\bfrom\\s+transactions\\b[\\s\\S]*\\bwhere\\b[\\s\\S]*\\baccount_id\\b\\s+in\\s*\\(\\s*select\\s+(?:\\w+\\.)?\\baccount_id\\b\\s+from\\s+\\bgroup_accounts\\b(?:\\s+(?:as\\s+)?\\w+)?\\s+where\\s+(?:\\w+\\.)?\\bgroup_id\\b\\s*=\\s*:groupId|\\bfrom\\s+transactions(?:\\s+(?:as\\s+)?\\w+)?\\s+(?:inner\\s+)?join\\s+group_accounts(?:\\s+(?:as\\s+)?\\w+)?\\s+on[\\s\\S]*\\baccount_id\\b\\s*=\\s*(?:\\w+\\.)?\\baccount_id\\b[\\s\\S]*\\bgroup_id\\b\\s*=\\s*:groupId)",
              "(?:substr\\s*\\(\\s*date\\s*,\\s*1\\s*,\\s*7\\s*\\)|\\bdate\\b)\\s*(?:(?:=|like|>=)\\s*\\?|between\\s+\\?\\s+and\\s+\\?)",
              "\\bselect\\b(?:(?!\\bfrom\\b)[\\s\\S])*?(?<!\\bas\\s)\\bamount\\b(?:(?!\\bfrom\\b)[\\s\\S])*?\\bfrom\\b",
              "\\btype\\b",
              "\\b(?:sum|total)\\s*\\(",
              "\\bis_internal_transfer\\b\\s*=\\s*(?:0|false)",
              "\\btransfer_target_account_id\\b",
              "\\bis_excluded_from_calculation\\b\\s*=\\s*(?:0|false)",
            ]
        forbiddenTextTerms:
          [
            transactions,
            is_transfer,
            is_internal_transfer,
            is_excluded_from_calculation,
            ":groupId",
          ]

- description: 食費の内訳を正しい円グラフで返す
  vars:
    question: 2026年7月の食費合計と内訳を円グラフで見せて
    evaluationDate: "2026-07-31T03:00:00.000Z"
    verificationSql: >-
      SELECT sub_category AS label, SUM(amount) AS total
      FROM transactions
      WHERE substr(date, 1, 7) = '2026-07'
        AND type = 'expense'
        AND category = '食費'
        AND is_excluded_from_calculation = 0
        AND account_id IN (SELECT account_id FROM group_accounts WHERE group_id = :groupId)
      GROUP BY sub_category
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPairs:
          - [食費, "41837"]
        expectedTextPairFacts: ["2026年7月"]
        expectedCharts:
          - chartType: pie
            titlePatterns: ["2026年7月", 食費]
            unit: currency
            series:
              - { name: 支出, amountType: expense }
            data:
              - { label: 食料品, values: [24833] }
              - { label: 外食, values: [12214] }
              - { label: カフェ, values: [4790] }
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          requiredSqlLiterals: [expense, 食費]
          requiredSqlLiteralBindings:
            - [expense, "\\btype\\b\\s*=\\s*__required_literal__"]
            - [食費, "\\b(?:category|sub_category)\\b\\s*=\\s*__required_literal__"]
          requiredSqlLiteralBindingGroups:
            - - [
                  "2026-07",
                  "(?:substr\\s*\\(\\s*date\\s*,\\s*1\\s*,\\s*7\\s*\\)|\\bdate\\b)\\s*(?:=|like)\\s*__required_literal__",
                ]
            - - ["2026-07-01", "\\bdate\\b\\s*>=\\s*__required_literal__"]
