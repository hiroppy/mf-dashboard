- description: 月次収支が収入・支出・収支の正しい値を返す
  vars:
    question: 2026年7月の収入・支出・収支を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["2026年7月"]
        expectedTextPairs:
          - [収入, "313235"]
          - [支出, "219894"]
          - [収支, "93341"]
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          expectedValues: ["313235", "219894"]
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "2026-07",
              "\\bamount\\b",
              "\\btype\\b",
              "\\b(?:sum|total)\\s*\\(",
            ]
        forbiddenTextTerms: [transactions, is_transfer, is_excluded_from_calculation, ":groupId"]

- description: 食費の内訳を正しい円グラフで返す
  vars:
    question: 2026年7月の食費合計と内訳を円グラフで見せて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPairs:
          - [食費, "41837"]
        expectedCharts:
          - chartType: pie
            unit: currency
            series:
              - { name: 支出, amountType: expense }
            data:
              - { label: 食料品, values: [24833] }
              - { label: 外食, values: [12214] }
              - { label: カフェ, values: [4790] }
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          expectedValues: ["24833", "12214", "4790"]
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "2026-07",
              "\\bamount\\b",
              "\\b(?:category|sub_category)\\b",
              "食費",
            ]
        forbiddenTextTerms: [transactions, is_transfer, is_excluded_from_calculation, ":groupId"]

