- description: 月次状況が収入・支出・収支と詳細導線を返す
  vars:
    question: 今月どう？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedFacts: ["2026-07", 313235, 219894, 93341]
        expectedCardTypes: [summary, insight]
        expectedRoute: /cf/2026-07
        forbiddenPhrases: [データを取得できません, わかりません]

