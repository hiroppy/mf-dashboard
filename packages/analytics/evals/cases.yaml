- description: データのない期間で金額を推測しない
  vars:
    question: 2030年1月の食費はいくら？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPatterns:
          - "(?:データ|明細).*(?:ありません|ない|見つかりません)"
        forbidAmounts: true
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          expectNoData: true
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "2030-01",
              "\\bamount\\b",
              "\\b(?:category|sub_category)\\b",
              "食費",
            ]
        forbiddenTextTerms: [transactions, is_transfer, is_excluded_from_calculation, ":groupId"]
