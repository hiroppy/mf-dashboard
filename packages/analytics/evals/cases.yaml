- description: 月次状況が収入・支出・収支と詳細導線を返す
  vars:
    question: 今月どう？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        allowedVisibleAmounts: [313235, 219894, 93341]
        allowedVisibleDates: ["2026-07-01", "2026-07-31"]
        allowedVisibleMonths: ["2026-07"]
        allowedVisiblePercentages: [29.8, 30]
        visibleAmountClaims:
          - { label: 収入, amount: 313235 }
          - { label: 支出, amount: 219894 }
          - { label: 収支, amount: 93341 }
          - { label: 黒字, amount: 93341 }
          - { label: プラス, amount: 93341 }
          - { label: 余剰, amount: 93341 }
          - { label: 手残り, amount: 93341 }
          - { label: 純収入, amount: 93341 }
        visiblePercentageClaims:
          - { label: 貯蓄率, amount: 29.8 }
          - { label: 貯蓄率, amount: 30 }
        allowedInsightMetrics:
          - { amount: 93341, amountType: balance, labelPattern: (黒字|収支|余剰|手残り) }
        expectedCardTextFacts:
          - { cardType: summary, pattern: "(2026[-/]07|2026年7月|7月)" }
        expectedCardTitleFacts:
          - { cardType: summary, pattern: "(家計|収支|月次|キャッシュフロー)" }
        forbiddenVisiblePatterns:
          - (赤字(?!\s*(では|じゃ)(なく|ない|ありません))|収支.{0,10}(マイナス|負)|マイナス.{0,10}収支)
          - (黒字|プラス|余剰|手残り)(とは言えません|とは限りません|ではない|ではなく|でない|ではありません)
          - (貯蓄|積立|予算|見直し).{0,12}(不要|必要ありません|必要ない|しなくてよい|しなくてもよい)
          - ((支出|出費).{0,12}(収入|所得).{0,12}(上回|超え|多い)|(収入|所得).{0,12}(支出|出費).{0,12}(下回|少ない))
          - (収入|所得)(は|が)?(ありません|ございません|ない|発生していません)
          - (支出|出費)(は|が)?(ありません|ございません|ない|発生していません)
        expectedMetrics:
          - { label: 収入, amount: 313235, amountType: income }
          - { label: 支出, amount: 219894, amountType: expense }
          - { label: 収支, amount: 93341, amountType: balance }
        expectedDataToolFacts:
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.totalIncome,
              value: 313235,
            }
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.totalExpense,
              value: 219894,
            }
          - {
              toolName: getMonthlySummaryByMonth,
              input: { month: "2026-07" },
              path: $.netIncome,
              value: 93341,
            }
        derivedVisibleClaims:
          - { amount: 29.8, sourceValues: [93341, 313235] }
          - { amount: 30, sourceValues: [93341, 313235] }
        requiredInsightPatterns:
          - (黒字|プラス|余剰|手残り)
          - (貯蓄|積立|予算|見直し|確保)
        expectedInsightActionPattern: (家計|収支|月次|予算|支出|内訳|詳細)
        expectedCardTypes: [summary, insight]
        expectedRoute: /0/cf/2026-07

