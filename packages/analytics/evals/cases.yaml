- description: 月次収支が収入・支出・収支の正しい値を返す
  vars:
    question: 2026年7月の収入・支出・収支を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["2026年7月"]
        expectedTextPairs:
          - [収入, "313235"]
          - [支出, "219894"]
          - [収支, "93341"]
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        forbiddenTextTerms: [transactions, is_transfer, is_excluded_from_calculation, ":groupId"]
        databaseQuery:
          predicatePatterns:
            - '(?:\bgroup_id\b\s*=\s*:groupId|:groupId\s*=\s*(?:\w+\.)?group_id\b)'
            - '\bdate\b\s*(?:=|>=|>|between\b|like\b|glob\b)'
            - '\bis_excluded_from_calculation\b\s*='
            - '\bis_internal_transfer\b\s*='
          sqlPatterns:
            - '\btransactions\b'
            - '(?:\bgroup_id\b\s*=\s*:groupId|:groupId\s*=\s*(?:\w+\.)?group_id\b)'
            - '\bdate\b[\s\S]{0,160}2026-07|2026-07[\s\S]{0,160}\bdate\b'
            - '\bamount\b'
            - '\btype\b'
            - '\bis_excluded_from_calculation\b'
            - '\bis_internal_transfer\b'
          forbiddenSqlPatterns:
            - '\b(?:313235|219894|93341)\b'
          outputCells:
            - { columnPattern: "income|収入", value: "313235" }
            - { columnPattern: "expense|支出", value: "219894" }
          expectedRowCount: 1

- description: 食費内訳が正しい合計と構造化chartを返す
  vars:
    question: 2026年7月の食費合計と内訳を、金額の多い順の円グラフで見せて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["食費"]
        expectedTextPairs:
          - [食費, "41837"]
        textPairBoundaries: [食料品, 外食, カフェ]
        expectedCharts:
          - chartType: pie
            unit: currency
            titleIncludes: [2026年7月, 食費]
            series:
              - { name: 支出, amountType: expense }
            data:
              - { label: 食料品, values: [24833] }
              - { label: 外食, values: [12214] }
              - { label: カフェ, values: [4790] }
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseQuery:
          predicatePatterns:
            - '(?:\bgroup_id\b\s*=\s*:groupId|:groupId\s*=\s*(?:\w+\.)?group_id\b)'
            - '\bdate\b\s*(?:=|>=|>|between\b|like\b|glob\b)'
            - '\btype\b\s*(?:=|in\b)'
            - '\bis_excluded_from_calculation\b\s*='
          sqlPatterns:
            - '\btransactions\b'
            - '(?:\bgroup_id\b\s*=\s*:groupId|:groupId\s*=\s*(?:\w+\.)?group_id\b)'
            - '\bdate\b[\s\S]{0,160}2026-07|2026-07[\s\S]{0,160}\bdate\b'
            - '\bamount\b'
            - '\bcategory\b'
            - '\btype\b[\s\S]{0,80}expense|expense[\s\S]{0,80}\btype\b'
            - '\bis_excluded_from_calculation\b'
          forbiddenSqlPatterns:
            - '\b(?:24833|12214|4790|41837)\b'
          outputRows:
            - [食料品, "24833"]
            - [外食, "12214"]
            - [カフェ, "4790"]
          expectedRowCount: 3

