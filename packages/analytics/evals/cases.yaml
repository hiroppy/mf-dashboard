- description: データのない期間で金額を捏造しない
  vars:
    question: 2027年1月の支出を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: regex
      value: (データ|取引|支出|記録|明細).*(ありません|見つかりません|確認できません|記録されていません|0件)
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        forbidAmounts: true
        databaseQuery:
          sqlPatterns:
            - '\btransactions\b'
            - '\bgroup_id\b\s*=\s*:groupId'
            - '\bdate\b[\s\S]{0,160}2027-01|2027-01[\s\S]{0,160}\bdate\b'
            - '\btype\b[\s\S]{0,80}expense|expense[\s\S]{0,80}\btype\b'
          expectEmpty: true
