- description: 月次状況が収入・支出・収支と詳細導線を返す
  vars:
    question: 今月どう？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedMetrics:
          - { label: 収入, amount: 313235, amountType: income }
          - { label: 支出, amount: 219894, amountType: expense }
          - { label: 収支, amount: 93341, amountType: balance }
        expectedCardTypes: [summary, insight]
        expectedRoute: /0/cf/2026-07

- description: 食費がカテゴリ合計・明細・詳細導線を返す
  vars:
    question: 今月の食費は？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedFacts: [食費]
        expectedMetrics:
          - { label: 食費, amount: 41837, amountType: expense }
        expectedCategories:
          - { label: 食費, amount: 41837, amountType: expense }
        expectedCardTypes: [summary, categoryBreakdown, transactionList]
        expectedRoute: /0/cf/2026-07

- description: 日付別支出が対象日・合計・明細を返す
  vars:
    question: 今月10日の支出を見たい
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedMetrics:
          - { label: 支出, amount: 6587, amountType: expense }
        expectedTransactions:
          - { date: "2026-07-10", amount: 3435 }
          - { date: "2026-07-10", amount: 3152 }
        expectedCardTypes: [summary, transactionList, action]
        expectedRoute: /0/cf/2026-07

- description: 総資産が fixture の残高と資産導線を返す
  vars:
    question: 総資産は？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedMetrics:
          - { label: 総資産, amount: 5683100, amountType: balance }
        expectedCardTypes: [summary]
        expectedRoute: /0/bs

- description: 支出改善が具体的なカテゴリ・根拠・内訳導線を返す
  vars:
    question: 削れそうな支出ある？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: 必ず削減できます
    - type: regex
      value: (食費|衣服・美容|日用品)
    - type: regex
      value: (前月|先月|前年|平均|通常|他カテゴリ)
    - type: regex
      value: (ため|ので|理由|高い|多い|増加|上回)
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedFacts: [2026-07]
        expectedCardTypes: [insight]
        expectedRoute: /0/cf/2026-07
