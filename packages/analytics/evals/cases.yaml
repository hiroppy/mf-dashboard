- description: データのない期間で金額を捏造しない
  vars:
    question: 2027年1月の支出を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPatterns:
          - (データ|取引|支出|記録|明細).*(ありません|見つかりません|確認できません|記録されていません|0件)
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        forbidAmounts: true
        databaseQuery:
          predicatePatterns:
            - '(?:\bgroup_id\b\s*=\s*:groupId|:groupId\s*=\s*(?:\w+\.)?group_id\b)'
            - '\bdate\b\s*(?:=|>=|>|between\b|like\b|glob\b)'
            - '\btype\b\s*(?:=|in\b)'
          sqlPatterns:
            - '\btransactions\b'
            - '(?:\bgroup_id\b\s*=\s*:groupId|:groupId\s*=\s*(?:\w+\.)?group_id\b)'
            - '\bdate\b[\s\S]{0,160}2027-01|2027-01[\s\S]{0,160}\bdate\b'
            - '\btype\b[\s\S]{0,80}expense|expense[\s\S]{0,80}\btype\b'
            - '\b(?:count\s*\(\s*(?:\*|1|(?:\w+\.)?id)\s*\)|sum\s*\(\s*amount\s*\))'
          expectEmpty: true
