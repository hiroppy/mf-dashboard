- description: 支出改善が具体的なカテゴリ・根拠・内訳導線を返す
  vars:
    question: 削れそうな支出ある？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: 必ず削減できます
    - type: not-regex
      value: (必ず|確実に|絶対に).{0,8}(削減|節約)(でき|可能)
    - type: not-regex
      value: (削減|節約)[がはも]?(できます|できる|可能です|可能だ)
    - type: javascript
      value: file://./assertions.ts
      config:
        allowedVisibleAmounts: [41837, 19475, 11198, 49922, 12111, 11495, 8085, 7364, 297]
        allowedVisibleDates: ["2026-06-30", "2026-07-31"]
        allowedVisiblePercentages: [29.8, 30, 64, 64.48, 64.5]
        allowedVisibleMonths: ["2026-06", "2026-07"]
        allowedCardHeadingDates: ["2026-07-31"]
        visibleMonthClaims:
          - { month: "2026-07" }
          - { month: "2026-06", rolePattern: (前月|先月|比較) }
        visibleAmountClaims:
          - { label: 食費, amount: 41837 }
          - { label: 食費, amount: 49922, rolePattern: (前月|先月|比較) }
          - { label: 食費, amount: 8085, rolePattern: (差額|差|増減|変化|円\s*(減|減少)|下回) }
          - { label: 衣服・美容, amount: 19475 }
          - { label: 衣服・美容, amount: 12111, rolePattern: (前月|先月|比較) }
          - {
              label: 衣服・美容,
              amount: 7364,
              rolePattern: (差額|差|増減|変化|円\s*(増|増加)|上回),
            }
          - { label: 日用品, amount: 11198 }
          - { label: 日用品, amount: 11495, rolePattern: (前月|先月|比較) }
          - { label: 日用品, amount: 297, rolePattern: (差額|差|増減|変化|円\s*(減|減少)|下回) }
        visiblePercentageClaims:
          - { label: 貯蓄率, amount: 29.8 }
          - { label: 貯蓄率, amount: 30 }
          - { label: 貯蓄率, amount: 64, rolePattern: (前月|先月|比較) }
          - { label: 貯蓄率, amount: 64.48, rolePattern: (前月|先月|比較) }
          - { label: 貯蓄率, amount: 64.5, rolePattern: (前月|先月|比較) }
        allowedInsightMetrics:
          - { amount: 19475, amountType: balance, labelPattern: (衣服・美容|衣服) }
          - {
              amount: 7364,
              amountType: balance,
              labelPattern: ((衣服・美容|衣服).*(差|増|前月|比較)|(差|増|前月|比較).*(衣服・美容|衣服)),
            }
        requireInsightMetric: true
        expectedInsightFacts: [2026-07]
        expectedCardTitleFacts:
          - { cardType: insight, pattern: (衣服・美容|衣服) }
        requiredInsightPatterns:
          - 衣服・美容
          - (衣服・美容.{0,40}(前月|先月).{0,20}(高い|多い|増加|上回)|(前月|先月).{0,20}衣服・美容.{0,20}(高い|多い|増加|上回))
          - (ため|ので|理由|高い|多い|増加|上回)
        expectedInsightActionPattern: ^(?=.*(衣服・美容|衣服)).*(内訳|支出|見る|確認)
        forbiddenVisiblePatterns:
          - (増加|上回|高い|多い)(していない|していません|とは限りません|とは言えません|とは認められません|[がは]?確認できません|ではない|でない|ではありません|対象外)
          - ((衣服・美容|衣服).{0,30}(前月|先月).{0,20}|(前月|先月).{0,20}(衣服・美容|衣服).{0,20})(減少|下回)(?!\s*(していない|していません|ではない|でない))
        expectedCardTypes: [insight]
        expectedRoute: /0/cf/2026-07
