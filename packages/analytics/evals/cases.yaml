- description: 月次収支が収入・支出・収支の正しい値を返す
  vars:
    question: 2026年7月の収入・支出・収支を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-regex
      value: (transactions|is_transfer|is_excluded_from_calculation|:groupId)
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["2026年7月"]
        expectedTextPairs:
          - [収入, "313235"]
          - [支出, "219894"]
          - [収支, "93341"]
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        requiresDatabaseQuery: true

- description: 食費内訳が正しい合計と構造化chartを返す
  vars:
    question: 2026年7月の食費合計と内訳を、金額の多い順の円グラフで見せて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: not-contains
      value: データを取得できません
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["食費", "41837"]
        expectedCharts:
          - chartType: pie
            unit: currency
            titleIncludes: [食費]
            series:
              - { name: 支出, amountType: expense }
            data:
              - { label: 食料品, values: [24833] }
              - { label: 外食, values: [12214] }
              - { label: カフェ, values: [4790] }
        expectedToolRoutes: []
        expectedTextLinks: []
        requiresDatabaseQuery: true

- description: 日付別支出が各明細を同じMarkdown表行に返す
  vars:
    question: 2026年7月10日の支出を、日付・内容・金額のMarkdown表で教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["6587"]
        expectedMarkdownRows:
          - ["2026-07-10", "東京ガス ガス代", "3435"]
          - ["2026-07-10", "成城石井", "3152"]
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        requiresDatabaseQuery: true

- description: 明示的なページ要求だけがroute tool由来のリンクを返す
  vars:
    question: 2026年7月の収支ページへのリンクを教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextFacts: ["2026年7月"]
        expectedCharts: []
        expectedToolRoutes: ["/0/cf/2026-07"]
        expectedTextLinks: ["/0/cf/2026-07"]

- description: データのない期間で金額を捏造しない
  vars:
    question: 2027年1月の支出を教えて
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: regex
      value: (データ|取引|支出|記録|明細).*(ありません|見つかりません|確認できません|記録されていません|0件)
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        forbidAmounts: true
        requiresDatabaseQuery: true
