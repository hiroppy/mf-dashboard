- description: データのない期間で金額を推測しない
  vars:
    question: 2030年1月の食費はいくら？
    evaluationDate: "2026-07-31T03:00:00.000Z"
    verificationSql: >-
      SELECT SUM(amount) AS total
      FROM transactions
      WHERE substr(date, 1, 7) = '2030-01'
        AND type = 'expense'
        AND category = '食費'
        AND is_transfer = 0
        AND is_excluded_from_calculation = 0
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPatterns:
          - "(?:データ|明細)(?:が|は)?(?:ありません|ない|見つかりません)(?![^。！？\\n]*(?:とは|わけ|限り|断定|言い切|可能性))"
        forbidAmounts: true
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        databaseEvidence:
          expectNoData: true
          requiredSqlPatterns:
            [
              "\\btransactions\\b",
              "2030-01",
              "\\bselect\\b(?:(?!\\bfrom\\b)[\\s\\S])*?(?:\\bamount\\b|\\bcount\\s*\\(\\s*\\*\\s*\\))(?:(?!\\bfrom\\b)[\\s\\S])*?\\bfrom\\b",
              "\\b(?:category|sub_category)\\b",
              "食費",
              "\\btype\\b\\s*=\\s*['\"]expense['\"]",
              "\\bis_transfer\\b\\s*=\\s*(?:0|false)",
              "\\bis_excluded_from_calculation\\b\\s*=\\s*(?:0|false)",
            ]
        forbiddenTextTerms:
          [
            transactions,
            is_transfer,
            is_internal_transfer,
            is_excluded_from_calculation,
            ":groupId",
          ]
