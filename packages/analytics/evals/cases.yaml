    - type: javascript
      value: file://./assertions.ts
      config:
        expectedDatabaseValues: ["2026-07-03", サンマルクカフェ, "761"]
        expectedDatabaseRows:
          - ["2026-07-03", サンマルクカフェ, "761"]
        requiredDatabaseQueryPatterns:
          - "\\btransactions\\b"
          - "(?:\\bdate\\b|\\b(?:substr|strftime)\\s*\\([^)]*\\bdate\\b[^)]*\\))\\s*(?:>=|>|=|like|between)\\s*['\"]?2026-07-03"
          - "(?:\\bdate\\b\\s*=\\s*['\"]?2026-07-03|\\bdate\\b\\s*(?:<|<=)\\s*['\"]?2026-07-04)"
          - "\\bcategory\\b\\s*(?:=|like|in)[^;]{0,80}食費"
          - "\\btype\\b\\s*=\\s*['\"]?expense"
          - "\\bgroup_id\\b\\s*=\\s*:groupId"
