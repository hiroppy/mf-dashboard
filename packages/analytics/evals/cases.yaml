- description: データのない期間で金額を推測しない
  vars:
    question: 2030年1月の食費はいくら？
    evaluationDate: "2026-07-31T03:00:00.000Z"
  assert:
    - type: is-json
    - type: javascript
      value: file://./assertions.ts
      config:
        expectedTextPatterns:
          - "(?:データ|明細|記録|取引).*(?:ありません|ない|見つかりません|確認できません(?:でした)?)"
        expectedNoDataTextFacts: ["2030年1月", 食費]
        forbidAmounts: true
        requireNoDataEvidence: true
        requiredNoDataQueryPatterns:
          - "\\btransactions\\b"
          - "(?:\\bdate\\b|\\b(?:substr|strftime)\\s*\\([^)]*\\bdate\\b[^)]*\\))\\s*(?:>=|>|=|like|between)\\s*['\"]?2030-01"
          - "(?:\\bdate\\b\\s+like\\s*['\"]2030-01%|\\b(?:substr|strftime)\\s*\\([^)]*\\bdate\\b[^)]*\\)\\s*=\\s*['\"]?2030-01|\\bdate\\b\\s*(?:<|<=)\\s*['\"]?2030-02)"
          - "\\bcategory\\b\\s*(?:=|like|in)[^;]{0,80}食費"
          - "\\btype\\b\\s*=\\s*['\"]?expense"
          - "\\bgroup_id\\b\\s*=\\s*:groupId"
        forbiddenNoDataQueryPatterns:
          - "\\b1\\s*=\\s*0\\b"
          - "\\b0\\s*=\\s*1\\b"
          - "\\blimit\\s+(?:0\\b|:[a-z_][a-z0-9_]*|\\?)"
          - "\\b(?:where|and)\\s+(?:0|null|false)\\b"
          - "\\bamount\\b\\s*(?:<=|<|=|>|>=|between|in|like)"
          - "\\bdate\\b\\s+like\\s*['\"]2030-01['\"]"
        expectedCharts: []
        expectedToolRoutes: []
        expectedTextLinks: []
        forbiddenTextTerms: [transactions, is_transfer, is_excluded_from_calculation, ":groupId"]
